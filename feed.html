<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Timeline em feed</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d0d0d;
      color: #f2f2f2;
      min-height: 100vh;
    }

    a { color: inherit; }

    /* Telas: feed e perfil */
    .view {
      max-width: 600px;
      margin: 0 auto;
      padding-bottom: calc(64px + env(safe-area-inset-bottom));
    }

    .view[hidden] { display: none; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      padding: 14px 16px;
      background: #0d0d0d;
      border-bottom: 1px solid #262626;
      font-size: 17px;
      font-weight: 800;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      background: #fff;
      flex: none;
    }

    .username {
      font-size: 15px;
      font-weight: 700;
    }

    /* Post de texto: abre os slides em tela cheia */
    .posts { list-style: none; }

    .tpost {
      display: flex;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid #262626;
      cursor: pointer;
    }

    .tpost:hover,
    .tpost:focus-visible {
      background: #141414;
      outline: none;
    }

    .tpost .t-body {
      flex: 1;
      min-width: 0;
    }

    .tpost .t-text {
      margin: 4px 0 10px;
      font-size: 16px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .tpost .t-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #9a9a9a;
    }

    .count {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      color: #f2f2f2;
    }

    .count::before {
      content: "";
      width: 12px;
      height: 12px;
      border: 2px solid currentColor;
      border-radius: 2px;
      box-shadow: 3px -3px 0 -1px #0d0d0d, 3px -3px 0 1px currentColor;
    }

    /* Perfil */
    .profile-head {
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 20px 16px 8px;
    }

    .profile-head .avatar {
      width: 86px;
      height: 86px;
    }

    .stats {
      flex: 1;
      display: flex;
      justify-content: space-around;
      text-align: center;
    }

    .stats b {
      display: block;
      font-size: 18px;
    }

    .stats span {
      font-size: 13px;
      color: #cfcfcf;
    }

    .profile-name {
      padding: 4px 16px 16px;
      border-bottom: 1px solid #262626;
    }

    .bio {
      margin-top: 4px;
      font-size: 14px;
      line-height: 1.4;
    }

    /* Menu fixo */
    .nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 15;
      display: flex;
      height: calc(56px + env(safe-area-inset-bottom));
      padding-bottom: env(safe-area-inset-bottom);
      background: #0d0d0d;
      border-top: 1px solid #262626;
    }

    .nav button {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: 0;
      color: #8a8a8a;
      cursor: pointer;
    }

    .nav button[aria-current="page"] { color: #f2f2f2; }

    .nav svg {
      width: 27px;
      height: 27px;
    }

    .nav .avatar {
      width: 28px;
      height: 28px;
      border: 2px solid transparent;
    }

    .nav button[aria-current="page"] .avatar { border-color: #f2f2f2; }

    .icon-btn {
      background: none;
      border: 0;
      color: #f2f2f2;
      font-size: 26px;
      line-height: 1;
      cursor: pointer;
      padding: 0 4px;
    }

    /* Quadro dos slides em tela cheia */
    .slide-box {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
    }

    /* Conteúdo dos slides (feed e stories) */
    .slide {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 9%;
      font-size: 16px;
      line-height: 1.3;
      overflow: hidden;
    }

    .slide.cover .s-title {
      font-size: 1.9em;
      font-weight: 800;
      letter-spacing: 0.01em;
      line-height: 1.15;
    }

    .slide .s-date {
      margin-top: 0.8em;
      font-size: 0.95em;
      color: #9a9a9a;
    }

    .slide .s-kicker {
      font-size: 0.75em;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #9a9a9a;
      margin-bottom: 0.8em;
    }

    .slide.text .s-text {
      font-size: 1.45em;
      line-height: 1.35;
    }

    .slide.list ul {
      list-style: none;
      margin-bottom: 1em;
    }

    .slide.list li {
      font-size: 1.05em;
      margin-bottom: 0.35em;
    }

    .slide.list li::before {
      content: "• ";
      color: #9a9a9a;
    }

    .slide.list a {
      text-decoration: underline;
    }

    .slide.media {
      padding: 0;
      align-items: center;
      background: #000;
    }

    .slide.media img,
    .slide.media video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* Stories em tela cheia */
    .stories {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: #000;
      display: none;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
    }

    .stories.open { display: flex; }

    .story-frame {
      touch-action: none;
      position: relative;
      width: min(100vw, calc(100vh * 9 / 16));
      height: 100vh;
      height: 100dvh;
      background: #0d0d0d;
      overflow: hidden;
    }

    .story-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 3;
      padding: max(10px, env(safe-area-inset-top)) 12px 12px;
      background: linear-gradient(#000c, #0000);
    }

    .bars {
      display: flex;
      gap: 4px;
      margin-bottom: 10px;
    }

    .bar {
      flex: 1;
      height: 3px;
      border-radius: 2px;
      background: #ffffff4d;
      overflow: hidden;
    }

    .bar i {
      display: block;
      height: 100%;
      width: 0;
      background: #fff;
    }

    .bar.done i { width: 100%; }

    .story-head {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .story-head .s-meta {
      font-size: 13px;
      color: #cfcfcf;
    }

    .story-head .icon-btn { margin-left: auto; }

    .story-stage {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
    }

    .story-stage .slide { font-size: 18px; }

    .loading {
      text-align: center;
      padding: 40px 16px;
      color: #9a9a9a;
    }
  </style>
</head>
<body>
  <section class="view" id="view-feed" aria-label="Feed">
    <div class="topbar">Feed</div>
    <ol class="posts" id="feed"><li class="loading">Carregando…</li></ol>
  </section>

  <section class="view" id="view-profile" aria-label="Perfil" hidden>
    <div class="profile-head">
      <img class="avatar" src="images/avatar-purojuiceamericamemes.jpg" alt="Foto de perfil de purojuiceamericamemes">
      <div class="stats">
        <div><b id="post-count">0</b><span>publicações</span></div>
        <div><b>0</b><span>seguidores</span></div>
        <div><b>0</b><span>seguindo</span></div>
      </div>
    </div>
    <div class="profile-name">
      <div class="username">purojuiceamericamemes</div>
      <p class="bio">The crème de la crème<br>Preferir não acreditar não torna o fato ficção.</p>
    </div>
    <ol class="posts" id="profile-feed"></ol>
  </section>

  <nav class="nav" aria-label="Menu">
    <button type="button" id="nav-feed" aria-label="Feed" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg>
    </button>
    <button type="button" id="nav-profile" aria-label="Perfil">
      <img class="avatar" src="images/avatar-purojuiceamericamemes.jpg" alt="">
    </button>
  </nav>

  <!-- Stories -->
  <div class="stories" id="stories" role="dialog" aria-modal="true" aria-label="Stories">
    <div class="story-frame">
      <div class="story-stage" id="story-stage"></div>
      <div class="story-top">
        <div class="bars" id="bars"></div>
        <div class="story-head">
          <img class="avatar" src="images/avatar-purojuiceamericamemes.jpg" alt="">
          <div>
            <div class="username">purojuiceamericamemes</div>
            <div class="s-meta" id="story-meta"></div>
          </div>
          <button type="button" class="icon-btn" id="story-close" aria-label="Fechar">&times;</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    var USER = 'purojuiceamericamemes';
    var AVATAR = 'images/avatar-purojuiceamericamemes.jpg';
    var STORY_MS = 8000;

    var SOURCE_NAMES = {
      'bbc.com': 'BBC', 'g1.globo.com': 'g1', 'oglobo.globo.com': 'O Globo', 'valor.globo.com': 'Valor',
      'folha.uol.com.br': 'Folha', 'noticias.uol.com.br': 'UOL', 'economia.uol.com.br': 'UOL',
      'pt.wikipedia.org': 'Wikipédia', 'en.wikipedia.org': 'Wikipédia (inglês)',
      'cnnbrasil.com.br': 'CNN Brasil', 'estadao.com.br': 'Estadão', 'metropoles.com': 'Metrópoles',
      'veja.abril.com.br': 'Veja', 'youtu.be': 'YouTube', 'youtube.com': 'YouTube', 'exame.com': 'Exame'
    };

    function sourceName(url) {
      try {
        var host = new URL(url).hostname.replace(/^www\d*\./, '');
        return SOURCE_NAMES[host] || host;
      } catch (e) { return url; }
    }

    function el(tag, cls, text) {
      var n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text != null) n.textContent = text;
      return n;
    }

    // ---------- Leitura das notícias a partir da timeline (index.html) ----------

    function listAfter(root, heading) {
      var h = Array.prototype.find.call(root.querySelectorAll('h2'), function (x) {
        return x.textContent.trim().toUpperCase() === heading;
      });
      var ul = h && h.nextElementSibling;
      return ul && ul.tagName === 'UL' ? Array.prototype.slice.call(ul.children) : [];
    }

    function parseEvents(doc) {
      return Array.prototype.map.call(doc.querySelectorAll('.timeline > .event'), function (li) {
        var ev = {
          title: li.querySelector('.title').textContent.trim(),
          date: (li.querySelector('.date') || { textContent: '' }).textContent.trim(),
          resumo: [], media: [], envolvidos: [], fontes: []
        };
        var btn = li.querySelector('.open-modal');
        var dlg = btn && doc.getElementById(btn.dataset.modal);

        if (dlg) {
          ev.resumo = listAfter(dlg, 'RESUMO').map(function (x) { return x.textContent.trim(); });
          ev.envolvidos = listAfter(dlg, 'ENVOLVIDOS').map(function (x) { return x.textContent.replace(/\s+/g, ' ').trim(); });
          ev.fontes = listAfter(dlg, 'FONTES').map(function (x) {
            var a = x.querySelector('a');
            return { label: x.textContent.trim(), href: a ? a.getAttribute('href') : null };
          });
          dlg.querySelectorAll('img').forEach(function (img) {
            ev.media.push({ type: 'img', src: img.getAttribute('src'), alt: img.getAttribute('alt') || '' });
          });
          dlg.querySelectorAll('video').forEach(function (v) {
            ev.media.push({
              type: 'video',
              poster: v.getAttribute('poster'),
              sources: Array.prototype.map.call(v.querySelectorAll('source'), function (s) {
                return { src: s.getAttribute('src'), type: s.getAttribute('type') };
              })
            });
          });
        } else {
          var seen = {};
          li.querySelectorAll('.card a[href]').forEach(function (a) {
            var href = a.getAttribute('href');
            if (seen[href]) return;
            seen[href] = true;
            var isTitle = !!a.querySelector('.title');
            ev.fontes.push({ label: isTitle ? sourceName(href) : a.textContent.trim(), href: href });
          });
        }
        ev.slides = buildSlides(ev);
        return ev;
      });
    }

    // Capa, um slide por tópico do resumo, imagens/vídeos e, por fim, envolvidos e fontes
    function buildSlides(ev) {
      var s = [{ kind: 'cover' }];
      ev.resumo.forEach(function (t) { s.push({ kind: 'text', text: t }); });
      ev.media.forEach(function (m) { s.push({ kind: 'media', media: m }); });
      if (ev.envolvidos.length || ev.fontes.length) s.push({ kind: 'list' });
      return s;
    }

    // ---------- Desenho dos slides ----------

    function renderSlide(ev, slide, opts) {
      var box = el('div', 'slide-box');
      var inner = el('div', 'slide ' + slide.kind);

      if (slide.kind === 'cover') {
        inner.appendChild(el('div', 's-title', ev.title));
      } else if (slide.kind === 'text') {
        inner.appendChild(el('div', 's-kicker', 'RESUMO'));
        inner.appendChild(el('div', 's-text', slide.text));
      } else if (slide.kind === 'media') {
        var m = slide.media;
        if (m.type === 'img') {
          var img = el('img');
          img.src = m.src;
          img.alt = m.alt;
          img.loading = 'lazy';
          inner.appendChild(img);
        } else {
          var v = el('video');
          v.playsInline = true;
          v.controls = !!(opts && opts.story);
          v.preload = 'metadata';
          if (m.poster) v.poster = m.poster;
          m.sources.forEach(function (src) {
            var so = el('source');
            so.src = src.src;
            if (src.type) so.type = src.type;
            v.appendChild(so);
          });
          inner.appendChild(v);
        }
      } else if (slide.kind === 'list') {
        if (ev.envolvidos.length) {
          inner.appendChild(el('div', 's-kicker', 'ENVOLVIDOS'));
          var ul = el('ul');
          ev.envolvidos.forEach(function (t) { ul.appendChild(el('li', null, t)); });
          inner.appendChild(ul);
        }
        if (ev.fontes.length) {
          inner.appendChild(el('div', 's-kicker', 'FONTES'));
          var ul2 = el('ul');
          ev.fontes.forEach(function (f) {
            var li = el('li');
            if (f.href) {
              var a = el('a', null, f.label);
              a.href = f.href;
              a.target = '_blank';
              a.rel = 'noopener noreferrer';
              li.appendChild(a);
            } else {
              li.textContent = f.label;
            }
            ul2.appendChild(li);
          });
          inner.appendChild(ul2);
        }
      }
      box.appendChild(inner);
      return box;
    }

    // Diminui a fonte até o texto caber no quadrado, como nos modais da timeline
    function fit(box) {
      var inner = box.querySelector('.slide');
      if (!inner || inner.classList.contains('media')) return;
      var size = Math.max(12, box.clientWidth / 22);
      inner.style.fontSize = size + 'px';
      while (size > 6 && inner.scrollHeight > inner.clientHeight + 1) {
        size -= 0.5;
        inner.style.fontSize = size + 'px';
      }
    }

    function textPost(ev) {
      var li = el('li', 'tpost');
      li.setAttribute('role', 'button');
      li.setAttribute('tabindex', '0');
      var av = el('img', 'avatar');
      av.src = AVATAR;
      av.alt = '';
      li.appendChild(av);
      var body = el('div', 't-body');
      body.appendChild(el('div', 'username', USER));
      body.appendChild(el('div', 't-text', ev.title));
      var meta = el('div', 't-meta');
      meta.appendChild(el('span', null, ev.date));
      meta.appendChild(el('span', 'count', String(ev.slides.length)));
      body.appendChild(meta);
      li.appendChild(body);
      var open = function () { openStories(ev, 0); };
      li.addEventListener('click', open);
      li.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
      });
      return li;
    }

    // ---------- Feed e perfil ----------

    var EVENTS = [];

    // Posts escritos direto no feed (não vêm da timeline), do mais recente para o mais antigo
    var POSTS = [
      {
        title: 'Voo de Flávio Bolsonaro chega aos EUA',
        date: '28 de outubro de 2026',
        resumo: [
          'Flávio Bolsonaro desembarcou com a mulher e as filhas no Aeroporto Executivo de Opa-Locka, em Miami, por volta das 10h25 (horário de Brasília)',
          'O jato Gulfstream da Baires Fly saiu de Puerto Iguazú, na Argentina, fez escala em Guayaquil, no Equador, e decolou de lá às 6h22',
          'A saída do Brasil aconteceu depois que o ministro Alexandre de Moraes, do STF, mandou o senador entregar os passaportes e o proibiu de deixar o país; a PF investiga a rota de Brasília até a Argentina',
          'Trump disse saber que Flávio estava na Argentina, mas não onde exatamente; segundo o Metrópoles, ele deu sinal verde para a entrada da família nos EUA'
        ],
        fontes: [
          { label: 'g1', href: 'https://g1.globo.com/mundo/noticia/2026/10/28/voo-flavio-bolsonaro-chega-aos-eua.ghtml' },
          { label: 'Poder360', href: 'https://www.poder360.com.br/poder-internacional/aviao-com-flavio-bolsonaro-chega-aos-eua/' },
          { label: 'Metrópoles', href: 'https://www.metropoles.com/mundo/aviao-flavio-bolsonaro-chega-eua-trump' }
        ]
      },
      {
        title: 'Empresa acusada de lavar dinheiro para aliado de Milei é dona do jato da fuga de Flávio Bolsonaro',
        date: '28 de outubro de 2026',
        resumo: [
          'Segundo a imigração argentina, Flávio cruzou a fronteira de Foz do Iguaçu para Puerto Iguazú na noite de 27 de outubro, com a mulher e as duas filhas, e embarcou num jato Gulfstream da Baires Fly',
          'A Baires Fly é investigada pela Justiça Federal de Buenos Aires por suspeita de lavagem de dinheiro no escândalo de superfaturamento de remédios da Andis, agência argentina para pessoas com deficiência, que derrubou um aliado de Milei',
          'O dono da empresa já pilotou o avião que levou Milei aos EUA; a Justiça argentina bloqueou bens de executivos e mandou apreender aeronaves da Baires Fly',
          'O jato fez escala em Guayaquil, no Equador, e pousou em Miami na manhã de 28 de outubro'
        ],
        fontes: [
          { label: 'UOL', href: 'https://noticias.uol.com.br/politica/ultimas-noticias/2026/10/28/empresa-lavagem-de-dinheiro-aliado-milei-dona-jato-fuga-flavio.htm' },
          { label: 'O Tempo', href: 'https://www.otempo.com.br/politica/judiciario/2026/10/28/dono-de-jato-que-levou-flavio-aos-eua-transportou-milei-e-e-investigado-por-lavagem-de-dinheiro' },
          { label: 'Infobae', href: 'https://www.infobae.com/america/america-latina/2026/10/27/flavio-bolsonaro-habria-salido-de-brasil-y-viajaria-a-estados-unidos-en-un-vuelo-privado-desde-argentina/' }
        ]
      },
      {
        title: 'Vucic, homem forte da Sérvia, admite derrota para movimento liderado por estudantes',
        date: '25 de outubro de 2026',
        onlyMedia: true,
        media: [
          { type: 'img', src: 'images/cnn-vucic-derrota.jpg', alt: 'Manchete da CNN: Serbia’s strongman leader Vucic concedes defeat to student-led movement in seismic political shift' },
          { type: 'img', src: 'images/guardian-vucic-trump-tower.jpg', alt: 'Manchete do The Guardian: Revealed: Serbian ruler’s secret role in illegal effort to help Trump business' }
        ]
      },
      {
        title: 'Já parou pra pensar que tem alguém nesse exato momento que votou 22 no RS com roupa que ganhou de doação das enchentes?',
        date: '25 de outubro de 2026'
      }
    ].map(function (p) {
      var ev = { title: p.title, date: p.date, resumo: p.resumo || [], media: p.media || [], envolvidos: p.envolvidos || [], fontes: p.fontes || [] };
      // onlyMedia: o post é só as imagens, sem capa nem slides de texto
      ev.slides = p.onlyMedia
        ? ev.media.map(function (m) { return { kind: 'media', media: m }; })
        : buildSlides(ev);
      return ev;
    });
    var feed = document.getElementById('feed');
    var profileFeed = document.getElementById('profile-feed');

    function renderLists() {
      feed.innerHTML = '';
      profileFeed.innerHTML = '';
      POSTS.concat(EVENTS.slice().reverse()).forEach(function (ev) {
        feed.appendChild(textPost(ev));
        profileFeed.appendChild(textPost(ev));
      });
      document.getElementById('post-count').textContent = POSTS.length + EVENTS.length;
    }

    function route() {
      var profile = location.hash === '#perfil';
      document.getElementById('view-feed').hidden = profile;
      document.getElementById('view-profile').hidden = !profile;
      document.getElementById('nav-feed').toggleAttribute('aria-current', !profile);
      document.getElementById('nav-profile').toggleAttribute('aria-current', profile);
      if (!profile) document.getElementById('nav-feed').setAttribute('aria-current', 'page');
      else document.getElementById('nav-profile').setAttribute('aria-current', 'page');
      window.scrollTo(0, 0);
    }

    document.getElementById('nav-feed').addEventListener('click', function () {
      if (location.hash === '#perfil') location.hash = '';
      else window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    document.getElementById('nav-profile').addEventListener('click', function () {
      if (location.hash !== '#perfil') location.hash = 'perfil';
      else window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    window.addEventListener('hashchange', route);
    route();

    // ---------- Stories ----------

    var stories = document.getElementById('stories');
    var stage = document.getElementById('story-stage');
    var bars = document.getElementById('bars');
    var meta = document.getElementById('story-meta');
    var cur = null, idx = 0, timer = null, startedAt = 0, elapsed = 0, paused = false;

    function openStories(ev, i) {
      cur = ev;
      bars.innerHTML = '';
      ev.slides.forEach(function () {
        var b = el('div', 'bar');
        b.appendChild(el('i'));
        bars.appendChild(b);
      });
      stories.classList.add('open');
      show(i);
    }

    function closeStories() {
      stopTimer();
      stage.querySelectorAll('video').forEach(function (v) { v.pause(); });
      stories.classList.remove('open');
      cur = null;
    }

    function show(i) {
      stopTimer();
      stage.querySelectorAll('video').forEach(function (v) { v.pause(); });
      idx = i;
      stage.innerHTML = '';
      var box = renderSlide(cur, cur.slides[i], { story: true });
      stage.appendChild(box);
      fit(box);
      meta.textContent = cur.date + ' · ' + (i + 1) + '/' + cur.slides.length;
      Array.prototype.forEach.call(bars.children, function (b, k) {
        b.classList.toggle('done', k < i);
        b.firstChild.style.transition = 'none';
        b.firstChild.style.width = k < i ? '100%' : '0';
      });
      var video = box.querySelector('video');
      if (video) {
        // Vídeo: a barra acompanha o vídeo e avança quando ele termina
        video.addEventListener('timeupdate', function () {
          if (video.duration) bars.children[idx].firstChild.style.width = (video.currentTime / video.duration * 100) + '%';
        });
        video.addEventListener('ended', next);
        var p = video.play();
        if (p && p.catch) p.catch(function () {});
      } else {
        elapsed = 0;
        startTimer();
      }
    }

    function startTimer() {
      if (!cur) return;
      var fill = bars.children[idx].firstChild;
      var remaining = STORY_MS - elapsed;
      startedAt = Date.now();
      fill.style.transition = 'none';
      fill.style.width = (elapsed / STORY_MS * 100) + '%';
      fill.offsetWidth;
      fill.style.transition = 'width ' + remaining + 'ms linear';
      fill.style.width = '100%';
      timer = setTimeout(next, remaining);
    }

    function stopTimer() {
      clearTimeout(timer);
      timer = null;
    }

    function pause() {
      if (!timer || paused) return;
      paused = true;
      stopTimer();
      elapsed += Date.now() - startedAt;
      var fill = bars.children[idx].firstChild;
      fill.style.transition = 'none';
      fill.style.width = (elapsed / STORY_MS * 100) + '%';
    }

    function resume() {
      if (!paused) return;
      paused = false;
      startTimer();
    }

    function next() {
      if (!cur) return;
      if (idx < cur.slides.length - 1) show(idx + 1);
      else closeStories();
    }

    function prev() {
      if (!cur) return;
      show(Math.max(0, idx - 1));
    }

    // Toque na esquerda volta, na direita avança; segurar pausa, como nos stories.
    // Arrastar para baixo a partir da metade de cima fecha a tela cheia.
    // Links das fontes, controles do vídeo e o botão de fechar continuam clicáveis.
    var frame = stories.querySelector('.story-frame');
    var downAt = 0, downX = 0, downY = 0, dragY = 0, tracking = false, canDrag = false, moved = false;

    function setDrag(y) {
      dragY = y;
      frame.style.transform = y ? 'translateY(' + y + 'px)' : '';
      stories.style.backgroundColor = y ? 'rgba(0,0,0,' + Math.max(0.2, 1 - y / frame.clientHeight) + ')' : '';
    }

    frame.addEventListener('pointerdown', function (e) {
      if (e.target.closest('a, video, button')) return;
      var r = frame.getBoundingClientRect();
      tracking = true;
      moved = false;
      downAt = Date.now();
      downX = e.clientX;
      downY = e.clientY;
      canDrag = e.clientY - r.top < r.height / 2;
      frame.style.transition = 'none';
      frame.setPointerCapture(e.pointerId);
      pause();
    });

    frame.addEventListener('pointermove', function (e) {
      if (!tracking) return;
      var dy = e.clientY - downY;
      if (Math.abs(dy) > 10 || Math.abs(e.clientX - downX) > 10) moved = true;
      if (canDrag) setDrag(Math.max(0, dy));
    });

    frame.addEventListener('pointerup', function (e) {
      if (!tracking) return;
      tracking = false;
      if (dragY > Math.min(120, frame.clientHeight * 0.18)) {
        frame.style.transition = 'transform 0.2s ease-out';
        frame.style.transform = 'translateY(100%)';
        setTimeout(function () { closeStories(); frame.style.transition = ''; setDrag(0); }, 200);
        return;
      }
      if (dragY) {
        frame.style.transition = 'transform 0.2s ease-out';
        setDrag(0);
      }
      if (moved || Date.now() - downAt > 300) { resume(); return; }
      paused = false;
      var r = frame.getBoundingClientRect();
      if (downX - r.left < r.width * 0.35) prev();
      else next();
    });

    frame.addEventListener('pointercancel', function () {
      if (!tracking) return;
      tracking = false;
      frame.style.transition = 'transform 0.2s ease-out';
      setDrag(0);
      resume();
    });

    document.getElementById('story-close').addEventListener('click', closeStories);

    document.addEventListener('keydown', function (e) {
      if (stories.classList.contains('open')) {
        if (e.key === 'ArrowRight') next();
        else if (e.key === 'ArrowLeft') prev();
        else if (e.key === 'Escape') closeStories();
      }
    });

    window.addEventListener('resize', function () {
      var box = stage.querySelector('.slide-box');
      if (box) fit(box);
    });

    // ---------- Início ----------

    fetch('index.html')
      .then(function (r) { return r.text(); })
      .then(function (html) {
        var doc = new DOMParser().parseFromString(html, 'text/html');
        EVENTS = parseEvents(doc);
        renderLists();
      })
      .catch(function () {
        feed.innerHTML = '<li class="loading">Não foi possível carregar as notícias.</li>';
      });
  </script>
</body>
</html>
