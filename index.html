<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timeline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #ffffff;
      color: #111;
      min-height: 100vh;
      display: flex;
      align-items: center;
      overflow-x: hidden;
    }

    /* Escala: 1990 (0%) até 2026 (100%) — cada ano = 100/36 % */
    .timeline {
      width: 100%;
      padding: 0 16px;
    }

    .line {
      position: relative;
      width: 100%;
      height: 2px;
      background: #111;
    }

    .range {
      position: absolute;
      top: -3px;
      height: 8px;
      background: #111;
      border-radius: 4px;
    }

    .event {
      position: absolute;
      top: 0;
      width: 0;
    }

    .dot {
      position: absolute;
      left: -7px;
      top: -6px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #111;
    }

    .tick {
      position: absolute;
      left: -1px;
      top: 0;
      width: 2px;
      height: 40px;
      background: #111;
    }

    .card {
      position: absolute;
      top: 44px;
      width: max-content;
      max-width: 36vw;
    }

    .card.start { left: -1px; text-align: left; }
    .card.end   { right: -1px; text-align: right; }
    .card.center { left: 0; transform: translateX(-50%); text-align: center; }

    /* Evento com texto acima da linha */
    .event.above .tick { top: auto; bottom: 0; }
    .event.above .card { top: auto; bottom: 44px; }

    .card a + a .title { margin-top: 6px; }
    .card a { display: block; }

    .card a {
      color: inherit;
      text-decoration: none;
    }

    .card a:hover .title { text-decoration: underline; }

    .title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .date {
      margin-top: 4px;
      font-size: 0.9rem;
      color: #555;
    }

    @media (max-width: 600px) {
      .title { font-size: 0.85rem; }
      .date  { font-size: 0.75rem; }
    }
  </style>
</head>
<body>
  <main class="timeline">
    <div class="line">

      <!-- 1993 – 1996 -->
      <div class="range" style="left: 8.333%; width: 8.333%;"></div>
      <div class="event" style="left: 8.333%;">
        <div class="tick"></div>
        <div class="card start">
          <a href="https://www.bbc.com/news/articles/c74xgp81pqgo" target="_blank" rel="noopener noreferrer">
            <div class="title">TRUMP VOOU NO JATO DE EPSTEIN</div>
            <div class="date">Entre 1993 e 1996</div>
          </a>
        </div>
      </div>

      <!-- 4 de fevereiro de 2004 -->
      <div class="event above" style="left: 39.141%;">
        <div class="dot"></div>
        <div class="tick"></div>
        <div class="card center">
          <a href="https://pt.wikipedia.org/wiki/Facebook" target="_blank" rel="noopener noreferrer">
            <div class="title">LANÇAMENTO FACEBOOK</div>
          </a>
          <a href="https://en.wikipedia.org/wiki/DARPA_LifeLog" target="_blank" rel="noopener noreferrer">
            <div class="title">CANCELAMENTO DARPA LIFELOG</div>
          </a>
          <div class="date">4 de fevereiro de 2004</div>
        </div>
      </div>

      <!-- 9 de maio de 2023 -->
      <div class="event" style="left: 91.667%;">
        <div class="dot"></div>
        <div class="tick"></div>
        <div class="card end">
          <a href="https://www.bbc.com/portuguese/articles/c7200q2jen2o" target="_blank" rel="noopener noreferrer">
            <div class="title">TRUMP CONDENADO POR ABUSO SEXUAL</div>
            <div class="date">9 de maio de 2023</div>
          </a>
        </div>
      </div>

    </div>
  </main>
</body>
</html>
